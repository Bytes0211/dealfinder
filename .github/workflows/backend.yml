name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "infrastructure/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod
      functions:
        description: "Space-separated functions for deploy-lambda.sh (default: all)"
        required: false
        default: ""
        type: string
      run_migrations:
        description: "Run Alembic migrations via Lambda"
        required: true
        default: false
        type: boolean

jobs:
  test-and-deploy:
    name: Test & Deploy Backend
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      TARGET_ENV: ${{ inputs.environment || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run backend tests
        run: uv run pytest tests/unit/ -v

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy Lambda functions (all)
        if: ${{ github.event_name == 'push' || inputs.functions == '' }}
        run: ./scripts/deploy-lambda.sh "${TARGET_ENV}"

      - name: Deploy selected Lambda functions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.functions != '' }}
        run: ./scripts/deploy-lambda.sh "${TARGET_ENV}" ${{ inputs.functions }}

      - name: Run migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations }}
        run: ./scripts/run-migrations-lambda.sh "${TARGET_ENV}"

      - name: Summary
        run: |
          echo "### Backend Deploy Completed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${TARGET_ENV}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.functions }}" ]; then
            echo "**Functions:** \`${{ inputs.functions }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Functions:** \`all\`" >> $GITHUB_STEP_SUMMARY
          fi
