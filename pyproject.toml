[project]
name = "dealfinder"
version = "0.4.0"
description = "AI-powered deal hunting autonomous agent system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.0",
    "pydantic==2.12.5",
    "pydantic-settings>=2.1.0",
    "httpx==0.28.1",
    "feedparser==6.0.12",
    "boto3==1.42.30",
    "pyyaml>=6.0.0",
    "mangum>=0.19.0",
    # Database (Phase 2)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    # Search (Phase 2)
    "opensearch-py>=2.4.0",
    "opensearch-dsl>=2.1.0",
    "email-validator>=2.3.0",
    "bcrypt>=4.0.0",
    "uvicorn>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "aiosqlite>=0.20.0",
    "black>=26.0.0",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealfinder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
