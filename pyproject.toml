[project]
name = "dealfinder"
version = "0.1.0"
description = "AI-powered deal hunting autonomous agent system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.0",
    "pydantic==2.12.5",
    "pydantic-settings>=2.1.0",
    "httpx==0.28.1",
    "feedparser==6.0.12",
    "boto3==1.42.30",
    "redis==7.1.0",
    "pyyaml>=6.0.0",
    # Database (Phase 2)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    # Search (Phase 2)
    "opensearch-py>=2.4.0",
    "opensearch-dsl>=2.1.0",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "black==26.1.0",
    "botocore==1.42.30",
    "certifi==2026.1.4",
    "click==8.3.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "idna==3.11",
    "iniconfig==2.3.0",
    "jmespath==1.0.1",
    "librt==0.7.8",
    "mypy==1.19.1",
    "mypy-extensions==1.1.0",
    "packaging==25.0",
    "pathspec==1.0.3",
    "platformdirs==4.5.1",
    "pluggy==1.6.0",
    "pydantic-core==2.41.5",
    "pygments==2.19.2",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "python-dateutil==2.9.0.post0",
    "pytokens==0.3.0",
    "ruff==0.14.13",
    "s3transfer==0.16.0",
    "sgmllib3k==1.0.0",
    "six==1.17.0",
    "starlette==0.50.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealfinder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
